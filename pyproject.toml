[project]
name = "espresso-infra"
version = "0.1.0"
description = "Infraestrutura AWS do banco PostgreSQL do Espresso"
authors = [{ name = "Espresso Platform" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "pulumi>=3.150.0,<4.0.0",
    "pulumi-aws>=7.0.0,<8.0.0",
    "pulumi-random>=4.16.0,<5.0.0",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
